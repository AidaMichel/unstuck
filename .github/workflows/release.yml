# Runs when you publish a GitHub release with a tag like v0.1.0.
# Tests, publishes to npm, and moves the major tag (v0) so `AidaMichel/unstuck@v0` picks up the new version.
# Needs one repository secret: NPM_TOKEN (an npm access token with publish rights).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write   # to move the major tag
  id-token: write   # for npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check the tag matches package.json
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v0.1.0 (got $TAG)"; exit 1
          fi
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Bump the version first."; exit 1
          fi
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add the NPM_TOKEN secret: Settings → Secrets and variables → Actions"; exit 1
          fi
          npm publish --provenance --access public
      - name: Move the major tag
        env:
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          git tag -f "$MAJOR"
          git push -f origin "refs/tags/$MAJOR"
