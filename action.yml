name: "UNSTUCK review"
description: "An AI agent team reviews every pull request: code, refactor plan, QA, risk & compliance, and a challenge pass."
author: "Aida Michel"
branding:
  icon: "shield"
  color: "purple"
inputs:
  anthropic-api-key:
    description: "Anthropic API key (optional; without it the free offline engine runs)"
    required: false
  mode:
    description: "review, audit or rescue"
    default: "review"
  fail-on:
    description: "Fail the check if findings at this severity or worse exist (P0, P1, P2, P3). Empty = never fail."
    default: "P0"
  team:
    description: "Use the five-specialist team (deeper, slower, costs more)"
    default: "false"
  model:
    description: "Claude model to use (optional)"
    default: ""
  lang:
    description: "Write the report in this language, e.g. Arabic (optional)"
    default: ""
  max-turns:
    description: "Maximum agent steps"
    default: "100"
  run-checks:
    description: "Let UNSTUCK run the project's tests, build and lint. They execute code from the pull request with the API key in the environment; only enable for trusted branches."
    default: "false"
  comment:
    description: "Post the report as a pull request comment (updated on every push)"
    default: "true"
outputs:
  report-path:
    description: "Path to the report file"
    value: ${{ steps.run.outputs.report }}
  exit-code:
    description: "0 = passed the severity gate, 1 = failed it or the run failed"
    value: ${{ steps.run.outputs.code }}
runs:
  using: "composite"
  steps:
    - name: Check for API key
      id: key
      shell: bash
      env:
        KEY: ${{ inputs.anthropic-api-key }}
      run: |
        echo "skip=false" >> "$GITHUB_OUTPUT"
        if [ -z "$KEY" ]; then
          echo "::notice title=UNSTUCK free engine::No ANTHROPIC_API_KEY (pull requests from forks don't get secrets). Running the free offline engine."
          echo "engine=offline" >> "$GITHUB_OUTPUT"
        else
          echo "engine=claude" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-node@v5
      if: steps.key.outputs.skip == 'false'
      with:
        node-version: "22"
    - name: Install UNSTUCK
      if: steps.key.outputs.skip == 'false'
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --no-audit --no-fund --loglevel=error && npm run build --silent
    - name: Run UNSTUCK
      id: run
      if: steps.key.outputs.skip == 'false'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE_REF: ${{ github.base_ref }}
        IN_MODE: ${{ inputs.mode }}
        IN_FAIL: ${{ inputs.fail-on }}
        IN_TEAM: ${{ inputs.team }}
        IN_MODEL: ${{ inputs.model }}
        IN_LANG: ${{ inputs.lang }}
        IN_TURNS: ${{ inputs.max-turns }}
        IN_CHECKS: ${{ inputs.run-checks }}
        IN_ENGINE: ${{ steps.key.outputs.engine }}
      run: |
        set +e
        # The report is written outside the checked-out project.
        REPORT="$RUNNER_TEMP/unstuck-report.md"
        rm -f "$REPORT"
        case "$IN_MODE" in review|audit|rescue) ;; *) echo "::error::mode must be review, audit or rescue"; exit 1;; esac
        ARGS=("$IN_MODE" "." --out "$REPORT" --engine "$IN_ENGINE" --max-turns "$IN_TURNS" --quiet)
        if [ "$IN_MODE" = "review" ] && [ -n "$BASE_REF" ]; then
          git fetch --no-tags --depth=500 origin "$BASE_REF" >/dev/null 2>&1
          ARGS+=(--base "origin/$BASE_REF")
        fi
        [ -n "$IN_FAIL" ] && ARGS+=(--fail-on "$IN_FAIL")
        [ -n "$IN_MODEL" ] && ARGS+=(--model "$IN_MODEL")
        [ -n "$IN_LANG" ] && ARGS+=(--lang "$IN_LANG")
        if [ "$IN_TEAM" = "true" ]; then ARGS+=(--team); else ARGS+=(--solo); fi
        [ "$IN_CHECKS" = "true" ] && ARGS+=(--run-checks)
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${ARGS[@]}" > /dev/null
        CODE=$?
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        if [ -f "$REPORT" ]; then
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          head -c 900000 "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0
    - name: Upload report
      if: steps.key.outputs.skip == 'false' && steps.run.outputs.report != ''
      uses: actions/upload-artifact@v5
      with:
        name: unstuck-report
        path: ${{ steps.run.outputs.report }}
    - name: Comment on pull request
      if: steps.key.outputs.skip == 'false' && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.report != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        REPORT: ${{ steps.run.outputs.report }}
      run: |
        BODY="$RUNNER_TEMP/unstuck-comment.md"
        node "$GITHUB_ACTION_PATH/dist/comment.js" "$REPORT" "$BODY"
        ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- unstuck:comment -->")) | .id' 2>/dev/null | tail -1)
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$BODY" >/dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$BODY"
        fi
    - name: Apply severity gate
      if: steps.key.outputs.skip == 'false'
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.code }}
      run: exit "${CODE:-1}"
